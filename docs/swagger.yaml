definitions:
  controllers.AdminLoginRequest:
    properties:
      password:
        type: string
      role:
        type: string
    required:
    - password
    - role
    type: object
  controllers.AdminRequest:
    properties:
      password:
        description: Admin password
        type: string
      role:
        description: Single role for the admin
        type: string
    type: object
  controllers.Credentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  controllers.PostSuggestionInput:
    properties:
      by:
        description: Example input
        example: 123
        type: integer
      suggestion:
        description: Example input
        example: This is a suggestion
        type: string
      tags:
        description: Example input
        example:
        - '["tag1"'
        - ' "tag2"]'
        items:
          type: string
        type: array
    type: object
  models.Response:
    properties:
      admin:
        description: Admin responding
        type: string
      content:
        description: Response content
        type: string
      created_at:
        description: Timestamp of the response
        type: string
      id:
        type: string
      suggestionId:
        description: Reference to the suggestion
        type: string
    type: object
  models.Suggestion:
    properties:
      by:
        type: string
      createdAt:
        type: string
      id:
        type: string
      parent:
        type: string
      reply:
        type: string
      status:
        type: string
      suggestion:
        type: string
      tags:
        description: Omit if nil
        items:
          type: string
        type: array
      views:
        type: integer
    type: object
  models.User:
    properties:
      password:
        type: string
      regnumber:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /admin:
    post:
      consumes:
      - application/json
      description: Create a new admin with a role and password
      parameters:
      - description: Admin data
        in: body
        name: admin
        required: true
        schema:
          $ref: '#/definitions/controllers.AdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new admin
      tags:
      - admins
  /admin/login:
    post:
      consumes:
      - application/json
      description: Login for admin using role and password
      parameters:
      - description: Admin login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/controllers.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Admin login
      tags:
      - admins
  /admin/suggestions:
    get:
      consumes:
      - application/json
      description: Fetch all suggestions with status "submitted" that are tagged for
        the logged-in admin.
      produces:
      - application/json
      responses:
        "200":
          description: List of suggestions tagged for the admin
          schema:
            items:
              $ref: '#/definitions/models.Suggestion'
            type: array
        "403":
          description: Forbidden - User is not an admin
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retrieve suggestions for admin
      tags:
      - Admin Suggestions
  /admin/suggestions/{suggestionId}/respond:
    post:
      consumes:
      - application/json
      description: Allows an admin to submit a response to a specific suggestion.
      parameters:
      - description: Suggestion ID
        in: path
        name: suggestionId
        required: true
        type: string
      - description: Response content
        in: body
        name: requestBody
        required: true
        schema:
          $ref: '#/definitions/models.Response'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created response
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request - Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - User is not an admin
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Respond to a suggestion
      tags:
      - Admin Responses
  /login:
    post:
      consumes:
      - application/json
      description: Login using username and password
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/controllers.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - users
  /suggestions:
    get:
      description: Get a list of all suggestions in the system
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved suggestions
          schema:
            items:
              $ref: '#/definitions/models.Suggestion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Retrieve all suggestions
      tags:
      - suggestions
    post:
      consumes:
      - application/json
      description: Add a new suggestion for the authenticated user
      parameters:
      - description: Bearer JWT Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Suggestion Details
        in: body
        name: suggestion
        required: true
        schema:
          $ref: '#/definitions/controllers.PostSuggestionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created suggestion
          schema:
            $ref: '#/definitions/models.Suggestion'
        "400":
          description: Bad Request - Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - Invalid token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new suggestion
      tags:
      - suggestions
  /suggestions/tag/{role}:
    get:
      description: Retrieve suggestions filtered by a specific tag or role
      parameters:
      - description: Role/Tag
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved suggestions
          schema:
            items:
              $ref: '#/definitions/models.Suggestion'
            type: array
        "400":
          description: Bad Request - Missing role
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No suggestions found for the tag
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get suggestions by tag/role
      tags:
      - suggestions
  /suggestions/user/{username}:
    get:
      description: Retrieve all suggestions submitted by a specific user
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user suggestions
          schema:
            items:
              $ref: '#/definitions/models.Suggestion'
            type: array
        "400":
          description: Bad Request - Missing username
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get suggestions by username
      tags:
      - suggestions
  /user:
    post:
      consumes:
      - application/json
      description: Create a new user with username, registration number, and password
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 'Conflict: User already exists'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - users
  /votes/{type}:
    post:
      consumes:
      - application/json
      description: Allows a user to upvote or downvote a suggestion. If the user has
        already voted, it will update the vote type.
      parameters:
      - description: Vote type (upvote or downvote)
        in: path
        name: type
        required: true
        type: string
      - description: Vote data with suggestion ID
        in: body
        name: vote
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Successfully added or updated vote
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body or vote type
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Username missing in claims, or suggestion not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: You have already voted with the same type
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add or update a vote on a suggestion
      tags:
      - votes
swagger: "2.0"
